name = "SeedVR2 3B"
backend = "seedvr2"
weights = "seedvr2/seedvr2_ema_3b_fp16.safetensors"
description = "One-step diffusion upscaler from ByteDance. Rebuilds realistic texture; slowest."
best_for = "Most realistic texture for photos. Slowest, and can invent details (wrong letters or numbers)."
speed = "~4-9 min"
default_scale = 2
max_scale = 4
order = 30
license = "Apache-2.0"
source = "https://github.com/numz/ComfyUI-SeedVR2_VideoUpscaler"

[options]
max_output_megapixels = 8   # above this, SeedVR2 generates up to 8 MP and plain resizing does the rest
color_correction = "lab"     # lab | wavelet | wavelet_adaptive | hsv | adain | none
vae_tiling = true
vae_tile_size = 512    # smaller tiles = less memory; 512 was 2x faster than 1024 on this Mac
seed = 42

